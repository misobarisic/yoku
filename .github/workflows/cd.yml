name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_prefix: macos
            target: x86_64-apple-darwin
            binary_postfix: ""
          - os: ubuntu-latest
            artifact_prefix: linux
            target: x86_64-unknown-linux-gnu
            binary_postfix: ""
          - os: windows-latest
            artifact_prefix: windows
            target: x86_64-pc-windows-msvc
            binary_postfix: ".exe"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary and checksum
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"

          binary_name="yoku${{ matrix.binary_postfix }}"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            strip "$binary_name"
          fi

          release_name="yoku-${{ matrix.artifact_prefix }}"
          tar -czf "$release_name.tar.gz" "$binary_name"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            checksum=$(certutil -hashfile "$release_name.tar.gz" SHA256 | sed -n '2p' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            printf '%s  %s\n' "$checksum" "$release_name.tar.gz" > "$release_name.sha256"
          else
            shasum -a 256 "$release_name.tar.gz" > "$release_name.sha256"
          fi
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/yoku-${{ matrix.artifact_prefix }}.tar.gz
            target/${{ matrix.target }}/release/yoku-${{ matrix.artifact_prefix }}.sha256
