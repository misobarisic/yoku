[workspace]
members = [".", "crates/yoku-core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
ratatui = "0.30"
tempfile = "3"

[package]
name = "yoku"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "A Markdown based terminal todo app"
license.workspace = true
repository = "https://github.com/misobarisic/yoku"

[dependencies]
clap.workspace = true
dirs.workspace = true
ratatui.workspace = true
yoku-core = { path = "crates/yoku-core" }
